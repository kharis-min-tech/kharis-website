name: content

# Only runs when apps/content or the shared root manifests change.
# See the required-check caveat in kp2.yml before making this required.
on:
  pull_request:
    paths:
      - "apps/content/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content.yml"
  push:
    branches: [main]
    paths:
      - "apps/content/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content.yml"

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Root install — npm workspaces resolves every app from the one lockfile.
      - name: Install
        run: npm ci
        working-directory: .

      - name: Lint
        run: npx eslint

      - name: Typecheck
        run: npx tsc --noEmit

      # Builds without secrets. Data calls happen in the browser after sign-in,
      # so the build does not need Supabase or Google keys.
      - name: Build
        run: npx next build
