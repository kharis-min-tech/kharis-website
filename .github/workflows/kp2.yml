name: deploy-kp2

# Ships apps/kp2 to Cloudflare on merge to main, only when its files (or the
# shared root manifests) changed. Quality is gated by ci.yml on the PR; with
# branch protection requiring the `ci-ok` check, code reaching main has already
# passed CI.
on:
  push:
    branches: [main]
    paths:
      - "apps/kp2/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kp2.yml"

# Least-privilege GITHUB_TOKEN: checkout only. The deploy authenticates to
# Cloudflare with CLOUDFLARE_API_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: kp2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kp2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a94432b07dae8050b83efdec72a492a3
      # Public, baked into the client bundle at build time. Set as repo
      # Variables: Settings → Secrets and variables → Actions → Variables.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://kharis.org/kp2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Check deploy config
        run: |
          : "${CLOUDFLARE_API_TOKEN:?set the CLOUDFLARE_API_TOKEN repo secret}"
          : "${NEXT_PUBLIC_SUPABASE_URL:?set the NEXT_PUBLIC_SUPABASE_URL repo variable}"
          : "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set the NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repo variable}"

      # opennextjs-cloudflare build && deploy. Worker runtime secrets
      # (YOUTUBE_API_KEY, INSTAGRAM_*) are not touched by a deploy.
      - name: Deploy to Cloudflare
        run: npm run deploy

      # Post-deploy smoke test. A green `wrangler deploy` only means the worker
      # uploaded, not that it runs: the Next 16.4.0 bump deployed "successfully"
      # yet threw Error 1101 (loadManifest preview-props.json) on every request.
      # kp2 serves under basePath "/kp2", so the health URL includes it.
      - name: Smoke test (post-deploy health check)
        run: |
          URL="https://kharis-kp2.itadmin-a94.workers.dev/kp2"
          echo "Health-checking $URL"
          code=000
          for i in $(seq 1 6); do
            code=$(curl -s -o body.out -w '%{http_code}' --max-time 25 "$URL" || echo 000)
            echo "attempt $i: HTTP $code"
            case "$code" in
              5*|000) sleep 10 ;;   # erroring/unreachable — wait for propagation, retry
              *) break ;;
            esac
          done
          case "$code" in
            5*|000)
              echo "::error::$URL never returned a non-5xx status (last: $code)"
              head -c 2000 body.out || true; exit 1 ;;
          esac
          if grep -qiE 'loadManifest|Worker threw exception|Error 1101' body.out; then
            echo "::error::$URL returned HTTP $code but the body is a runtime-error page"
            head -c 2000 body.out; exit 1
          fi
          case "$code" in
            2*|3*) echo "OK: $URL is live (HTTP $code)" ;;
            4*) echo "::warning::$URL returned HTTP $code — worker ran but refused the request; check auth/routing" ;;
          esac
