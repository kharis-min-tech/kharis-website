name: deploy-main

# Ships apps/main to Cloudflare on merge to main, only when its files (or the
# shared root manifests) changed. Quality (incl. the tsc ratchet) is gated by
# ci.yml on the PR; with branch protection requiring the `ci-ok` check, code
# reaching main has already passed CI.
on:
  push:
    branches: [main]
    paths:
      - "apps/main/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/main.yml"

# Least-privilege GITHUB_TOKEN: checkout only. The deploy authenticates to
# Cloudflare with CLOUDFLARE_API_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: main-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a94432b07dae8050b83efdec72a492a3
      # Public, baked into the client bundle at build time. Set as repo
      # Variables: Settings → Secrets and variables → Actions → Variables.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://kharis.org
      # Optional: the contact map renders only when this is set (repo Variable).
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Check deploy config
        run: |
          : "${CLOUDFLARE_API_TOKEN:?set the CLOUDFLARE_API_TOKEN repo secret}"
          : "${NEXT_PUBLIC_SUPABASE_URL:?set the NEXT_PUBLIC_SUPABASE_URL repo variable}"
          : "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set the NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repo variable}"

      # opennextjs-cloudflare build && deploy. Worker runtime secrets
      # (YOUTUBE_API_KEY, GEMINI_API_KEY) are not touched by a deploy.
      - name: Deploy to Cloudflare
        run: npm run deploy
